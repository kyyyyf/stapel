# The stapel process for this repository. Created by `stapel init`; hand edits survive later runs.

[tickets]
# Key of a new ticket; {n} is the next number.
key = "@PREFIX@-{n}"

# Sections of ticket.md in order. depends_on: a change in these sections makes a confirmation of this
# one stale.
[[sections]]
id = "spec"
title = "Spec"
owner = "product"

[[sections]]
id = "design"
title = "Design"
owner = "engineer"
depends_on = ["spec"]

[[sections]]
id = "proof"
title = "Proof"
owner = "qa"
depends_on = ["spec", "design"]

[[sections]]
id = "plan"
title = "Plan"
owner = "engineer"
depends_on = ["spec", "design"]

[[sections]]
id = "review"
title = "Review"
owner = "generated"

[[sections]]
id = "summary"
title = "Summary"
owner = "generated"

# Role -> model. Starting values from docs/PLAN.md; change them by measured tokens.
[models]
author   = { provider = "claude-code", model = "claude-opus-5-5" }
builder  = { provider = "claude-code", model = "claude-sonnet-5-5" }
reviewer = { provider = "claude-code", model = "claude-sonnet-5-5" }
external = { provider = "anthropic-api", model = "claude-fable-5-1", required = false }
drift    = { provider = "claude-code", model = "claude-sonnet-5-5" }
cheap    = { provider = "claude-code", model = "claude-haiku-4-5" }

# Sections whose fresh confirmations together permit code writes.
[build]
requires = ["spec", "design", "proof"]

# Write guard: agents may always change these paths; the rest only while a build is allowed.
[guard]
always_writable = [".stapel/", "docs/"]
