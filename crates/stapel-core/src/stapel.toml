# Процесс stapel для этого репозитория. Файл создан `stapel init`; правки сохраняются при повторном запуске.

[tickets]
# Ключ нового тикета; {n} — следующий номер.
key = "@PREFIX@-{n}"

# Разделы ticket.md в порядке следования. depends_on: изменение этих разделов делает подтверждение
# текущего устаревшим.
[[sections]]
id = "spec"
title = "Спека"
owner = "product"

[[sections]]
id = "design"
title = "Решение"
owner = "engineer"
depends_on = ["spec"]

[[sections]]
id = "proof"
title = "Доказательство"
owner = "qa"
depends_on = ["spec", "design"]

[[sections]]
id = "plan"
title = "План"
owner = "engineer"
depends_on = ["spec", "design"]

[[sections]]
id = "review"
title = "Ревью"
owner = "generated"

[[sections]]
id = "summary"
title = "Итог"
owner = "generated"

# Роль → модель. Стартовые значения из docs/PLAN.md, менять по замерам токенов.
[models]
author   = { provider = "claude-code", model = "claude-opus-5-5" }
builder  = { provider = "claude-code", model = "claude-sonnet-5-5" }
reviewer = { provider = "claude-code", model = "claude-sonnet-5-5" }
external = { provider = "anthropic-api", model = "claude-fable-5-1", required = false }
drift    = { provider = "claude-code", model = "claude-sonnet-5-5" }
cheap    = { provider = "claude-code", model = "claude-haiku-4-5" }

# Хук записи: эти пути агент может менять всегда, остальные — только при разрешённой сборке.
[guard]
always_writable = [".stapel/", "docs/"]
