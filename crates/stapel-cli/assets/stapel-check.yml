name: stapel check
on:
  push:
    branches: ["{PREFIX}-[0-9]+"]
  pull_request:
jobs:
  check:
    if: github.event_name == 'push' || startsWith(github.head_ref, '{PREFIX}-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Local branches
        run: git fetch --no-tags --update-head-ok origin '+refs/heads/*:refs/heads/*'
      - name: Install stapel
        run: cargo install --git https://github.com/kyyyyf/stapel --rev {COMMIT} --locked stapel-cli
      - name: Check
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: stapel check "$BRANCH"
