[package]
name = "stapel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stapel"
path = "src/main.rs"

[dependencies]
stapel-core = { path = "../stapel-core" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
predicates = "3"
assert_cmd = "2"
serde_json = "1"
