# stapel: 0.1.0 sha256:343151896aeead589341177ab4b8af7f4570bf4b2703e96c1aca82d444999652
name: stapel check
on:
  push:
    branches: ["STP-[0-9]+"]
  pull_request:
jobs:
  check:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'STP-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Local branches
        run: git fetch --no-tags --update-head-ok . '+refs/remotes/origin/*:refs/heads/*' '^refs/remotes/origin/HEAD'
      - name: Install stapel
        run: cargo install --git https://github.com/kyyyyf/stapel --rev 2eb71f89bb7e41dc81f26ba8163b8189fea6af3b --locked stapel-cli
      - name: Check
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: stapel check --level full "$BRANCH"
