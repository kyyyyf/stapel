# stapel: 0.1.0 sha256:e3eb1820f1569e2a3cc3e2c037bac71dba9a9695aa998fecd4baefe2add1fd6a
name: stapel check
on:
  push:
    branches: ["STP-[0-9]+"]
  pull_request:
jobs:
  check:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'STP-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Local branches
        run: git fetch --no-tags --update-head-ok origin '+refs/heads/*:refs/heads/*'
      - name: Install stapel
        run: cargo install --git https://github.com/kyyyyf/stapel --rev f49448d2da1aabeea046a5e44d5b72bb56f319e7 --locked stapel-cli
      - name: Check
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: stapel check "$BRANCH"
