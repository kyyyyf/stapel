# stapel: 0.1.0 sha256:4a81a7fc34f08c4ab699d510e38a85836658abd20d05eed279790480844cbd2d
name: stapel check
on:
  push:
    branches: ["STP-[0-9]+"]
  pull_request:
jobs:
  check:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'STP-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Local branches
        run: git fetch --no-tags --update-head-ok . '+refs/remotes/origin/*:refs/heads/*' '^refs/remotes/origin/HEAD'
      - name: Install stapel
        run: cargo install --git https://github.com/kyyyyf/stapel --rev 0b2d40dd14aefb70e538c1517c9dd80fa6986ea8 --locked stapel-cli
      - name: Check
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: stapel check "$BRANCH"
