# The stapel process for this repository. Created by `stapel init`; hand edits survive later runs.

[tickets]
# Key of a new ticket; {n} is the next number.
key = "STP-{n}"

# Sections of ticket.md in order. depends_on: a change in these sections makes a confirmation of this
# one stale.
[[sections]]
id = "description"
title = "Description"
owner = "product"

[[sections]]
id = "spec"
title = "Spec"
owner = "product"

[[sections]]
id = "design"
title = "Design"
owner = "engineer"
depends_on = ["spec"]

[[sections]]
id = "proof"
title = "Proof"
owner = "qa"
depends_on = ["spec", "design"]

[[sections]]
id = "plan"
title = "Plan"
owner = "engineer"
depends_on = ["spec", "design"]

[[sections]]
id = "review"
title = "Review"
owner = "generated"

[[sections]]
id = "summary"
title = "Summary"
owner = "generated"

# Role -> model. Starting values from docs/PLAN.md; change them by measured tokens.
[models]
author   = { provider = "claude-code", model = "claude-opus-5-5" }
builder  = { provider = "claude-code", model = "claude-sonnet-5-5" }
reviewer = { provider = "claude-code", model = "claude-sonnet-5-5" }
# The person has no access to Fable since 2026-11-23: the external reviewer runs on Opus.
external = { provider = "anthropic-api", model = "claude-opus-5-5", required = false }
drift    = { provider = "claude-code", model = "claude-sonnet-5-5" }
cheap    = { provider = "claude-code", model = "claude-haiku-4-5" }
orchestrator = { provider = "claude-code", model = "claude-opus-5-5" }
research     = { provider = "claude-code", model = "claude-opus-5-5" }
translator   = { provider = "claude-code", model = "claude-sonnet-5-5" }

# Agent type -> role of its token records (STP-26); a type without a row is recorded as `research`.
[roles]
stapel-builder = "builder"
stapel-depends = "depends"
stapel-drift = "drift"
stapel-reviewer = "reviewer"
stapel-spec-reviewer = "reviewer"
stapel-external-reviewer = "external"

# Machine-wide cargo slots of `stapel cargo` and `stapel check` (STP-42); 10 cores and 16 GB here.
[cargo]
slots = 3

# Sections whose fresh confirmations together permit code writes.
[build]
requires = ["description", "spec", "design", "proof"]

# Write guard: agents may always change these paths; the rest only while a build is allowed.
[guard]
always_writable = [".stapel/", "docs/"]

# RED to GREEN check of ticket steps (STP-4): `stapel check` runs each step's tests at its
# RED and GREEN commits and at HEAD; with this section, `stapel close` needs a passing check.
[check]
runner = "cargo"
timeout_secs = 5400
# The person asked on 2026-11-23 for fewer local checks: none after each step.
points = ["review", "close"]
